<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ligue 2 Amateur - Groupe Centre Est 2026-2027</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #222; padding: 10px; }
  h1 { text-align: center; color: #1a4d2e; margin-bottom: 12px; font-size: 1.1em; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 80px; padding: 10px 6px; text-align: center; border-radius: 8px 8px 0 0; background: #ddd; cursor: pointer; font-weight: bold; font-size: 12px; }
  .tab.active { background: #1a4d2e; color: white; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  button, select, input { padding: 8px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }
  button { background: #1a4d2e; color: white; cursor: pointer; border: none; }
  button:hover { background: #2d7a4a; }
  .btn-small { padding: 5px 8px; font-size: 12px; margin: 1px; }
  .btn-edit { background: #2980b9; }
  .btn-del { background: #c0392b; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 12px; white-space: nowrap; }
  th { background: #1a4d2e; color: white; position: sticky; top: 0; }
  tr:hover { background: #f0f8f4; }
  .score { font-weight: bold; color: #1a4d2e; }
  .obs { color: #c0392b; font-style: italic; }
  .obs-empty { color: #999; }
  .empty { text-align: center; padding: 30px; color: #888; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; padding: 10px; }
  .modal.active { display: flex; }
  .modal-content { background: white; padding: 15px; border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  .modal-content h3 { margin-bottom: 10px; color: #1a4d2e; font-size: 1em; }
  .modal-content label { display: block; margin-top: 8px; font-size: 12px; color: #555; }
  .modal-content input, .modal-content select { width: 100%; margin-top: 3px; padding: 8px; }
  .modal-actions { margin-top: 15px; display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 14px; font-size: 13px; }
  .btn-cancel { background: #888; }
  .count { text-align: center; font-size: 12px; color: #666; margin-bottom: 8px; }
  .classement-table { min-width: 100%; font-size: 11px; }
  .classement-table th, .classement-table td { padding: 6px 4px; text-align: center; }
  .classement-table td.equipe { text-align: left; font-weight: bold; }
  .zone-montee { background: #d4edda !important; }
  .zone-playoff { background: #fff3cd !important; }
  .zone-relégation { background: #f8d7da !important; }
  .classement-filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .legend { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin: 10px 0; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-color { width: 15px; height: 15px; border-radius: 3px; }
</style>
</head>
<body>

<h1>🏆 Ligue 2 Amateur – Groupe Centre Est 2026-2027</h1>

<div class="tabs">
  <div class="tab active" onclick="switchTab('championnat', this)">🏆 Championnat</div>
  <div class="tab" onclick="switchTab('coupe', this)">🏅 Coupe</div>
  <div class="tab" onclick="switchTab('classement', this)">📊 Classement</div>
</div>

<!-- CHAMPIONNAT -->
<div id="tab-championnat" class="tab-content active">
  <div class="toolbar">
    <button onclick="openModal('championnat')">➕ Ajouter</button>
    <button onclick="exportData('championnat')">💾 Exporter</button>
    <button onclick="document.getElementById('importChampionnat').click()">📂 Importer</button>
    <input type="file" id="importChampionnat" accept=".json" style="display:none" onchange="importData(event,'championnat')">
  </div>
  <div class="toolbar">
    <select id="filterJournee" onchange="render('championnat')">
      <option value="">Toutes les journées</option>
    </select>
    <select id="filterEquipe" onchange="render('championnat')">
      <option value="">Toutes les équipes</option>
    </select>
  </div>
  <div class="count" id="countChampionnat"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>J</th><th>Date</th><th>Heure</th><th>Domicile</th><th>Score</th>
          <th>Extérieur</th><th>Stade</th><th>Obs.</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody-championnat"></tbody>
    </table>
  </div>
</div>

<!-- COUPE -->
<div id="tab-coupe" class="tab-content">
  <div class="toolbar">
    <button onclick="openModal('coupe')">➕ Ajouter un match MOB</button>
    <button onclick="exportData('coupe')">💾 Exporter</button>
    <button onclick="document.getElementById('importCoupe').click()">📂 Importer</button>
    <input type="file" id="importCoupe" accept=".json" style="display:none" onchange="importData(event,'coupe')">
  </div>
  <div class="count" id="countCoupe"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Tour</th><th>Date</th><th>Heure</th><th>Domicile</th><th>Score</th>
          <th>Extérieur</th><th>Stade</th><th>Obs.</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody-coupe"></tbody>
    </table>
  </div>
</div>

<!-- CLASSEMENT -->
<div id="tab-classement" class="tab-content">
  <div class="classement-filters">
    <label style="font-size:13px;">Classement après : </label>
    <select id="selectJourneeClassement" onchange="renderClassement()">
      <option value="all">Général (toutes journées)</option>
    </select>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background:#d4edda;"></div> Montée directe</div>
    <div class="legend-item"><div class="legend-color" style="background:#fff3cd;"></div> Playoffs</div>
    <div class="legend-item"><div class="legend-color" style="background:#f8d7da;"></div> Relégation</div>
  </div>
  <div class="table-wrap">
    <table class="classement-table">
      <thead>
        <tr>
          <th>Pos</th><th>Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th>
          <th>BP</th><th>BC</th><th>Diff</th><th>Pts</th>
        </tr>
      </thead>
      <tbody id="tbody-classement"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Ajouter</h3>
    <input type="hidden" id="editIndex">
    <input type="hidden" id="editSection">
    <label id="lblJournee">Journée <input type="number" id="fJournee" min="1" max="30"></label>
    <label>Date <input type="date" id="fDate"></label>
    <label>Heure <input type="time" id="fHeure"></label>
    <label>Équipe domicile <select id="fDom"></select></label>
    <label>Équipe extérieur <select id="fExt"></select></label>
    <label>Score domicile <input type="number" id="fSd" min="0"></label>
    <label>Score extérieur <input type="number" id="fSe" min="0"></label>
    <label>Stade <select id="fStade" onchange="onStadeChange()"></select></label>
    <label id="lblStadeAutre" style="display:none;">Autre stade (préciser) <input type="text" id="fStadeAutre"></label>
    <label>Observations <input type="text" id="fObs" placeholder="Report, Huis-Clos..."></label>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button onclick="saveMatch()">Enregistrer</button>
    </div>
  </div>
</div>

// Chargement avec conservation des données
let data = JSON.parse(localStorage.getItem('l2a_data') || 'null');
if (!data || !data.championnat) {
  data = {
    championnat: CHAMPIONNAT_INIT.map((m,i)=>({...m, id:'c'+i})),
    coupe: []
  };
}
if (!data.coupe) data.coupe = [];

function save() { localStorage.setItem('l2a_data', JSON.stringify(data)); }

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'classement') renderClassement();
}

function formatDate(d) {
  if (!d) return '';
  const p = d.split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d;
}

function render(section) {
  const tbody = document.getElementById('tbody-'+section);
  const count = document.getElementById('count'+section.charAt(0).toUpperCase()+section.slice(1));
  let list = data[section];

  if (section === 'championnat') {
    const fj = document.getElementById('filterJournee').value;
    const fe = document.getElementById('filterEquipe').value;
    list = list.filter(m =>
      (!fj || m.journee == fj) &&
      (!fe || m.dom === fe || m.ext === fe)
    );
    // Trier par journée puis par date
    list = [...list].sort((a,b) => {
      if (parseInt(a.journee||0) !== parseInt(b.journee||0)) return parseInt(a.journee||0) - parseInt(b.journee||0);
      return (a.date||'').localeCompare(b.date||'');
    });
  }

  if (count) count.textContent = list.length + ' rencontre(s) affichée(s) sur ' + data[section].length;

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">Aucune rencontre. Cliquez sur ➕ Ajouter.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  list.forEach((m) => {
    const i = data[section].indexOf(m);
    const score = (m.sd !== '' && m.se !== '' && m.sd !== null && m.sd !== undefined && m.se !== null && m.se !== undefined)
      ? `<span class="score">${m.sd} - ${m.se}</span>` : '<span style="color:#999">— vs —</span>';
    const firstCol = section === 'championnat' ? 'J'+(m.journee||'') : (m.journee||'');
    tbody.innerHTML += `
      <tr>
        <td><b>${firstCol}</b></td>
        <td>${formatDate(m.date)}</td>
        <td>${m.heure || ''}</td>
        <td>${m.dom || ''}</td>
        <td>${score}</td>
        <td>${m.ext || ''}</td>
        <td>${m.stade || ''}</td>
        <td class="obs ${m.obs?'':'obs-empty'}">${m.obs || '—'}</td>
        <td>
          <button class="btn-small btn-edit" onclick="editMatch('${section}', ${i})">✏️</button>
          <button class="btn-small btn-del" onclick="deleteMatch('${section}', ${i})">🗑️</button>
        </td>
      </tr>`;
  });

  if (section === 'championnat') updateFilters();
}

function updateFilters() {
  const journees = [...new Set(data.championnat.map(m => parseInt(m.journee)).filter(Boolean))].sort((a,b)=>a-b);
  const fsj = document.getElementById('filterJournee');
  const fse = document.getElementById('filterEquipe');
  const vj = fsj.value, ve = fse.value;
  fsj.innerHTML = '<option value="">Toutes les journées</option>' + journees.map(j=>`<option value="${j}">J${j}</option>`).join('');
  fse.innerHTML = '<option value="">Toutes les équipes</option>' + EQUIPES.map(e=>`<option value="${e}">${e}</option>`).join('');
  fsj.value = vj; fse.value = ve;
  const sel = document.getElementById('selectJourneeClassement');
  const vc = sel.value;
  sel.innerHTML = '<option value="all">Général (toutes journées)</option>' +
    journees.map(j=>`<option value="${j}">Après J${j}</option>`).join('');
  sel.value = vc || 'all';
}

function populateSelects() {
  document.getElementById('fDom').innerHTML = '<option value="">-- Choisir --</option>' + EQUIPES.map(e=>`<option value="${e}">${e}</option>`).join('');
  document.getElementById('fExt').innerHTML = '<option value="">-- Choisir --</option>' + EQUIPES.map(e=>`<option value="${e}">${e}</option>`).join('');
  document.getElementById('fStade').innerHTML = '<option value="">-- Choisir --</option>' + STADES.map(s=>`<option value="${s}">${s}</option>`).join('') + '<option value="__AUTRE__">✏️ Autre stade...</option>';
}

function onStadeChange() {
  const v = document.getElementById('fStade').value;
  document.getElementById('lblStadeAutre').style.display = (v === '__AUTRE__') ? 'block' : 'none';
}

function openModal(section, idx) {
  document.getElementById('editSection').value = section;
  document.getElementById('editIndex').value = idx !== undefined ? idx : '';
  const isChamp = section === 'championnat';
  document.getElementById('lblJournee').style.display = 'block';
  document.getElementById('modalTitle').textContent =
    (idx !== undefined ? 'Modifier' : 'Ajouter') + ' — ' +
    (isChamp ? '🏆 Championnat' : '🏅 Coupe (MO Béjaïa)');

  if (idx === undefined) {
    ['fJournee','fDate','fHeure','fSd','fSe','fObs','fStadeAutre'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fDom').value = '';
    document.getElementById('fExt').value = '';
    document.getElementById('fStade').value = '';
    document.getElementById('lblStadeAutre').style.display = 'none';
    if (!isChamp) document.getElementById('fDom').value = 'MO Béjaïa';
  }
  document.getElementById('modal').classList.add('active');
}

function closeModal() { document.getElementById('modal').classList.remove('active'); }

function editMatch(section, i) {
  populateSelects();
  const m = data[section][i];
  document.getElementById('editSection').value = section;
  document.getElementById('editIndex').value = i;
  document.getElementById('modalTitle').textContent = 'Modifier — ' + (section === 'championnat' ? '🏆 Championnat' : '🏅 Coupe');
  document.getElementById('fJournee').value = m.journee || '';
  document.getElementById('fDate').value = m.date || '';
  document.getElementById('fHeure').value = m.heure || '';
  document.getElementById('fDom').value = m.dom || '';
  document.getElementById('fExt').value = m.ext || '';
  document.getElementById('fSd').value = m.sd ?? '';
  document.getElementById('fSe').value = m.se ?? '';
  document.getElementById('fObs').value = m.obs || '';
  if (m.stade && STADES.includes(m.stade)) {
    document.getElementById('fStade').value = m.stade;
    document.getElementById('lblStadeAutre').style.display = 'none';
  } else if (m.stade) {
    document.getElementById('fStade').value = '__AUTRE__';
    document.getElementById('fStadeAutre').value = m.stade;
    document.getElementById('lblStadeAutre').style.display = 'block';
  } else {
    document.getElementById('fStade').value = '';
    document.getElementById('lblStadeAutre').style.display = 'none';
  }
  document.getElementById('modal').classList.add('active');
}

function saveMatch() {
  const section = document.getElementById('editSection').value;
  let stade = document.getElementById('fStade').value;
  if (stade === '__AUTRE__') stade = document.getElementById('fStadeAutre').value.trim();
  const m = {
    journee: document.getElementById('fJournee').value,
    date: document.getElementById('fDate').value,
    heure: document.getElementById('fHeure').value,
    dom: document.getElementById('fDom').value,
    ext: document.getElementById('fExt').value,
    sd: document.getElementById('fSd').value,
    se: document.getElementById('fSe').value,
    stade: stade,
    obs: document.getElementById('fObs').value.trim()
  };
  if (!m.dom || !m.ext) { alert('Choisissez les deux équipes'); return; }
  if (m.dom === m.ext) { alert('Les deux équipes doivent être différentes'); return; }
  const idx = document.getElementById('editIndex').value;
  if (idx === '') {
    data[section].push({...m, id: section.charAt(0)+Date.now()});
  } else {
    data[section][idx] = {...data[section][idx], ...m};
  }
  save(); closeModal(); render(section);
  if (document.getElementById('tab-classement').classList.contains('active')) renderClassement();
}

function deleteMatch(section, i) {
  if (confirm('Supprimer cette rencontre ?')) {
    data[section].splice(i,1); save(); render(section);
    if (document.getElementById('tab-classement').classList.contains('active')) renderClassement();
  }
}

function renderClassement() {
  const journeeMax = document.getElementById('selectJourneeClassement').value;
  const tbody = document.getElementById('tbody-classement');

  const stats = {};
  EQUIPES.forEach(e => stats[e] = { j:0, g:0, n:0, p:0, bp:0, bc:0, pts:0 });

  data.championnat.forEach(m => {
    if (m.sd === '' || m.se === '' || m.sd === null || m.se === null || m.sd === undefined || m.se === undefined) return;
    if (journeeMax !== 'all' && parseInt(m.journee) > parseInt(journeeMax)) return;
    const sd = parseInt(m.sd), se = parseInt(m.se);
    if (isNaN(sd) || isNaN(se)) return;
    if (!stats[m.dom] || !stats[m.ext]) return;
    stats[m.dom].j++; stats[m.ext].j++;
    stats[m.dom].bp += sd; stats[m.dom].bc += se;
    stats[m.ext].bp += se; stats[m.ext].bc += sd;
    if (sd > se) { stats[m.dom].g++; stats[m.dom].pts+=3; stats[m.ext].p++; }
    else if (sd < se) { stats[m.ext].g++; stats[m.ext].pts+=3; stats[m.dom].p++; }
    else { stats[m.dom].n++; stats[m.dom].pts++; stats[m.ext].n++; stats[m.ext].pts++; }
  });

  const classement = EQUIPES.map(e => ({ equipe: e, ...stats[e], diff: stats[e].bp - stats[e].bc }))
    .sort((a,b) => {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.diff !== a.diff) return b.diff - a.diff;
      if (b.bp !== a.bp) return b.bp - a.bp;
      return a.equipe.localeCompare(b.equipe);
    });

  if (classement.every(c => c.j === 0)) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty">Aucun match joué pour le moment.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  classement.forEach((c, idx) => {
    const pos = idx + 1;
    let zoneClass = '';
    if (pos === 1) zoneClass = 'zone-montee';
    else if (pos === 2 || pos === 3) zoneClass = 'zone-playoff';
    else if (pos >= 14) zoneClass = 'zone-relégation';
    tbody.innerHTML += `
      <tr class="${zoneClass}">
        <td><b>${pos}</b></td>
        <td class="equipe">${c.equipe}</td>
        <td>${c.j}</td>
        <td>${c.g}</td>
        <td>${c.n}</td>
        <td>${c.p}</td>
        <td>${c.bp}</td>
        <td>${c.bc}</td>
        <td>${c.diff > 0 ? '+'+c.diff : c.diff}</td>
        <td><b>${c.pts}</b></td>
      </tr>`;
  });
}

function exportData(section) {
  const blob = new Blob([JSON.stringify(data[section], null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'l2a-' + section + '-2026-2027.json';
  a.click();
}

function importData(e, section) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (confirm('Remplacer les données de ' + section + ' ?')) {
        data[section] = imported; save(); render(section);
        if (document.getElementById('tab-classement').classList.contains('active')) renderClassement();
      }
    } catch { alert('Fichier invalide'); }
  };
  reader.readAsText(file);
}

save();
populateSelects();
render('championnat');
render('coupe');
</script>
</body>
</html>
